[package]
    authors      = ["Eric Evans <ciresnave@gmail.com>"]
    description  = "Shares bare memory-mapped bytes between programs: local mapping on one machine, byte-range mirrors over WSS elsewhere, with service-scoped access control"
    edition      = "2021"
    license      = "MIT"
    name         = "commy"
    repository   = "https://github.com/ciresnave/commy"
    version      = "0.11.1"

[lib]

[[bin]]
    name = "commy"
    path = "src/main.rs"

[dependencies]
    auth-framework    = "0.4"
    chrono            = { version = "0.4", features = ["serde"] }
commy-wire = "0.3.1"
    futures           = "0.3"
    memmap2           = "0.9"
    rmp-serde         = "1.1"
role-system = "1.3.0"
    rustls            = "0.23"
    rustls-pemfile    = "2.0"
    serde             = { version = "1.0", features = ["derive"] }
    serde_json        = "1.0"
    sha2              = "0.10"
    thiserror         = "2.0"
    tokio             = { version = "1", features = ["full"] }
    tokio-rustls      = "0.26"
    tokio-tungstenite = "0.28"
    uuid              = { version = "1.0", features = ["serde", "v4"] }

[dev-dependencies]
rcgen = "0.14.10"
    tempfile = "3.8"
