[package]
    authors      = ["Eric Evans <ciresnave@gmail.com>"]
    description  = "Shares bare memory-mapped bytes between programs: local mapping on one machine, byte-range mirrors over WSS elsewhere, with service-scoped access control"
    edition      = "2021"
    license      = "MIT"
    name         = "commy"
    repository   = "https://github.com/ciresnave/commy"
    version      = "0.27.7"

[features]
    # The cluster code (src/clustering.rs, src/server/clustering) is experimental and not used by the server.
    clustering = []

[lib]

[[bin]]
    name = "commy"
    path = "src/main.rs"

[dependencies]
    # Exact pin: Cargo orders pre-release rcN as text, so rc97 > rc126 and a bare lower bound would admit yanked builds.
    auth-framework    = { version = "=0.6.0-rc150", features = ["sqlite-storage"] }
    chrono            = { version = "0.4", features = ["serde"] }
commy-wire = "0.5.0"
    futures           = "0.3"
hkdf = "0.13"
    memmap2           = "0.9"
persistant = "0.9.24"
role-system = "1.3.0"
    rustls            = "0.23"
    rcgen             = "0.14.10"
    serde             = { version = "1.0", features = ["derive"] }
    serde_json        = "1.0"
    toml              = "1.1"
    sha2              = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
    thiserror         = "2.0"
    tokio             = { version = "1.54.1", features = ["full"] }
    tokio-rustls      = "0.26"
    tokio-tungstenite = "0.28"
    uuid              = { version = "1.0", features = ["serde", "v4"] }

[dev-dependencies]
    tempfile = "3.8"
