name: CI & Release

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run all tests
        run: cargo test --all --locked

      - name: Run the experimental clustering tests
        run: cargo test --all --locked --features clustering

  test-unix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Run all tests
        run: cargo test --all --locked

  # Advisory portfolio check (CodeRipper). Not a required check; its findings are tracked in ROADMAP.md,
  # no rule is silenced. Public repository, so no runs-on override.
  portfolio:
    name: Portfolio (CodeRipper, advisory)
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@ee9c3950c510fae136d316fed3bd9ecda343cede # 0.9.24

  release:
    name: Release
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    # Only attempt a release on pushes to main
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main'"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Extract version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -match 'version\s*=\s*"([^"]+)"') {
            $version = $Matches[1]
          } else {
            Write-Error "Could not parse version from Cargo.toml"
            exit 1
          }
          $tag = "v$version"
          Write-Host "Detected version: $version (tag: $tag)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check whether this version is already released
        id: check_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          # gh release view exits non-zero when the release does not exist;
          # capture output to suppress it and reset exit code so the step doesn't fail.
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>&1 | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          Write-Host "Release $tag exists: $exists"
          "release_exists=$($exists.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Rust toolchain
        if: steps.check_release.outputs.release_exists == 'false'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Cargo registry and build artifacts
        if: steps.check_release.outputs.release_exists == 'false'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        if: steps.check_release.outputs.release_exists == 'false'
        run: cargo build --release --locked --bin commy

      - name: Create GitHub Release
        if: steps.check_release.outputs.release_exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag     = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $asset   = "target\release\commy.exe"

          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --title "Commy $tag" `
            --generate-notes `
            "$asset#commy-$version-windows-x86_64.exe"

          Write-Host "Release $tag created successfully."
